<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Zackconnect</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="auth-brand" aria-label="Zackconnect">
        <img src="images/logo.png" alt="">
        <span>ZACKCONNECT</span>
    </header>

    <!-- Signup Section -->
    <section class="auth-section">
        <div class="container">
            <div class="auth-card">
                <div class="auth-header">
                    <h1 class="auth-title">Create account</h1>
                    <p class="auth-subtitle">Join Zackconnect today</p>
                </div>
                <form class="auth-form" id="signupForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstname">First name</label>
                            <input type="text" id="firstname" name="firstname" placeholder="First name" required>
                        </div>
                        <div class="form-group">
                            <label for="lastname">Last name</label>
                            <input type="text" id="lastname" name="lastname" placeholder="Last name" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" autocomplete="tel" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Create a password" minlength="8" required>
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">Confirm password</label>
                        <input type="password" id="confirm-password" name="confirm-password"
                            placeholder="Confirm your password" required>
                    </div>
                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" name="terms" required>
                            <span>I agree to the <a href="#" class="auth-link">Terms of Service</a> and <a href="#"
                                    class="auth-link">Privacy Policy</a></span>
                        </label>
                    </div>
                    <label class="checkbox-label auth-remember-option">
                        <input type="checkbox" name="remember">
                        <span>Keep me logged in on this device</span>
                    </label>
                    <button type="submit" class="auth-submit-button">Create account</button>
                    <p class="auth-status" id="signupStatus" aria-live="polite"></p>
                </form>
                <div class="auth-footer">
                    <p>Already have an account? <a href="login.html" class="auth-link">Log in</a></p>
                    <p class="auth-storage-note">This demo saves accounts in this browser only. It is not secure for real customer accounts.</p>
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>

</html>
