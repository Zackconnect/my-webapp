<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquire - Zackconnect</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <img src="images/logo.png" alt="Zackconnect Logo" class="logo-image">
                <span class="logo-text">ZACKCONNECT</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="software.html">Software</a></li>
                <li><a href="car-import.html">Car Import</a></li>
                <li><a href="data-bundels.html">Data Bundles</a></li>
                <li><a href="bajaj.html">Bajaj Tricycles</a></li>
                <li><a href="login.html?return=enquire.html" class="nav-auth-link">Log in</a></li>
            </ul>
        </div>
    </nav>

    <!-- Enquire Hero Section -->
    <section class="enquire-hero">
        <div class="container">
            <p class="enquire-category">ENQUIRE</p>
            <h1 class="enquire-title">Let's talk</h1>
            <p class="enquire-description">Tell us what you need and we'll get back to you quickly.</p>
        </div>
    </section>

    <!-- Enquire Form Section -->
    <section class="enquire-form-section">
        <div class="container">
            <form class="enquire-form" id="enquiryForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="fullname">Full name</label>
                        <input type="text" id="fullname" name="fullname" placeholder="Full name" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="tel" id="phone" name="phone" placeholder="Phone number" autocomplete="tel" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <label for="service">Software</label>
                    <select id="service" name="service" required>
                        <option value="" disabled selected>Select a service</option>
                        <option value="software">Software</option>
                        <option value="car-import">Car Import</option>
                        <option value="data-bundles">Data Bundles</option>
                        <option value="bajaj">Bajaj Tricycles</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="message">How can we help?</label>
                    <textarea id="message" name="message" rows="5" placeholder="How can we help?" required></textarea>
                </div>
                <button type="submit" class="enquire-submit-button">Send enquiry</button>
                <p class="enquiry-submit-status" id="enquirySubmitStatus" aria-live="polite"></p>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-simple">
                <div class="footer-brand">
                    <span class="logo-text">ZACKCONNECT</span>
                    <p class="footer-tagline">Your link to quality service</p>
                </div>
                <div class="footer-actions">
                    <a href="admin.html" class="footer-link">Admin</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
